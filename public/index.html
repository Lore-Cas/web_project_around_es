<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="ie=edge" http-equiv="X-UA-Compatible" />
    <title>Around The U.S.</title>
    <link href="./pages/index.css" rel="stylesheet" />

  </head>
  <body class="page">
    <div class="page__content">
      <header class="header page__section">
        <img
          alt="Logotipo Around The U.S."
          class="logo header__logo"
          src="./images/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img class="profile__image" src="./images/avatar.jpg" alt="Fotografía del perfil de usuario" />
          <div class="profile__info">
            <h1 class="profile__title">Jacques Cousteau</h1>
            <button
              aria-label="Editar perfil"
              class="profile__edit-button"
              type="button"
            ></button>
            <p class="profile__description">Explorador</p>
          </div>
          <button
            aria-label="Agregar tarjeta"
            class="profile__add-button"
            type="button"
          ></button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list"></ul>

          <template id="card-template">
            <li class="card">
              <button
                aria-label="Ampliar imagen de la tarjeta"
                class="card__image-button"
                type="button"
              >
                <img alt="" class="card__image" src="#" />
              </button>
              <button
                aria-label="Eliminar tarjeta"
                class="card__delete-button"
                type="button"
              ></button>
              <div class="card__description">
                <h2 class="card__title"></h2>
                <button
                  aria-label="Botón Me gusta"
                  class="card__like-button"
                  type="button"
                ></button>
              </div>
            </li>
          </template>
          
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">© 2025 Around The U.S.</p>
      </footer>
      <div class="popup" id="edit-popup" role="dialog" aria-modal="true" aria-labelledby="edit-popup-title" aria-hidden="true">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title" id="edit-popup-title">Editar perfil</h3>
          <form class="popup__form" id="edit-profile-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_name"
                id="profile-name"
                name="name"
                placeholder="Nombre"
                aria-label="Nombre"
                aria-describedby="profile-name-error"
                type="text"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="popup__error" id="profile-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_description"
                id="profile-description"
                name="description"
                placeholder="Acerca de mí"
                aria-label="Acerca de mí"
                aria-describedby="profile-description-error"
                type="text"
                required
                minlength="2"
                maxlength="200"
              />
              <span class="popup__error" id="profile-description-error" aria-live="polite"></span>
            </label>
            <button class="button popup__button" type="submit">Guardar</button>
          </form>
        </div>
      </div>
      <div class="popup" id="new-card-popup" role="dialog" aria-modal="true" aria-labelledby="new-card-popup-title" aria-hidden="true">
        <div class="popup__content">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <h3 class="popup__title" id="new-card-popup-title">Nuevo lugar</h3>
          <form class="popup__form" id="new-card-form" novalidate>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_card-name"
                id="place-name"
                name="place-name"
                placeholder="Título"
                aria-label="Título"
                aria-describedby="place-name-error"
                required
                minlength="2"
                maxlength="30"
                type="text"
              />
              <span class="popup__error" id="place-name-error" aria-live="polite"></span>
            </label>
            <label class="popup__field">
              <input
                class="popup__input popup__input_type_url"
                id="place-link"
                name="link"
                placeholder="Enlace a la imagen"
                aria-label="Enlace a la imagen"
                aria-describedby="place-link-error"
                required
                type="url"
              />
              <span class="popup__error" id="place-link-error" aria-live="polite"></span>
            </label>
            <button class="button popup__button" type="submit">Crear</button>
          </form>
        </div>
      </div>
      <div class="popup" id="image-popup" role="dialog" aria-modal="true" aria-label="Vista ampliada de la imagen" aria-hidden="true">
        <div class="popup__content popup__content_content_image">
          <button
            aria-label="Cerrar ventana emergente"
            class="popup__close"
            type="button"
          ></button>
          <img alt="" class="popup__image" src="#" />
          <p class="popup__caption"></p>
        </div>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
